name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify bundled-library inputs
        run: |
          python -c "import customtkinter, matplotlib, psutil, tkinter; print('customtkinter', customtkinter.__version__); print('matplotlib', matplotlib.__version__); print('psutil', psutil.__version__); print('tk', tkinter.TkVersion)"
      - name: Run tests
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            {
              echo "### macOS test failure"
              echo '```text'
              tail -n 80 test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_text="$(tail -n 40 test-output.txt | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/' | tr -d '\n')"
            echo "::error title=macOS test failure::$failure_text"
            exit "$status"
          fi
      - name: Build application bundle
        run: python -m PyInstaller --noconfirm --clean WatchdogPerf-macOS.spec
      - name: Verify architecture and CLI startup
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          file dist/WatchdogPerf.app/Contents/MacOS/WatchdogPerf
          dist/WatchdogPerf.app/Contents/MacOS/WatchdogPerf --version
          find dist/WatchdogPerf.app \( -name "libpython*.dylib" -o -path "*/Python.framework/Versions/*/Python" \) -print -quit | grep .
          find dist/WatchdogPerf.app -name "*_tkinter*" -print -quit | grep .
          find dist/WatchdogPerf.app -iname "*psutil*" -print -quit | grep .
          find dist/WatchdogPerf.app -path "*matplotlib*" -print -quit | grep .
          find dist/WatchdogPerf.app -path "*customtkinter*" -print -quit | grep .
          find dist/WatchdogPerf.app -name "echarts.min.js" -print -quit | grep .
      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/WatchdogPerf.app "dist/WatchdogPerf-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WatchdogPerf-macOS-${{ matrix.arch }}
          path: dist/WatchdogPerf-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
